name: diagramio

services:
  postgres:
    # Cùng phiên bản chính với máy đo Kaggle và Testcontainers (PostgreSQL 16).
    # Volume tạo bởi bản 15 không mở được bằng bản 16: xem README mục 5 (docker compose down -v).
    image: postgres:16-alpine
    container_name: diagramio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-diagram_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-diagram_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diagramio

  redis:
    # Cache L2 dùng chung giữa các instance (B2, ADR-0003); chỉ được dùng khi DIAGRAMIO_CACHE_MODE là redis hoặc
    # two-level. Chỉ là cache nên không lưu xuống đĩa; đầy thì bỏ khóa có hạn dùng ít dùng nhất.
    image: redis:7.4-alpine
    container_name: diagramio_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb",
              "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diagramio

  app:
    build: .
    image: diagramio-app
    container_name: diagramio_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Trong mạng Docker, DB được gọi bằng tên service "postgres" và cổng bên trong 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-diagram_app}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-it-32chars}
      # Cache sơ đồ: none | local | redis | two-level (mặc định local, không cần Redis)
      DIAGRAMIO_CACHE_MODE: ${DIAGRAMIO_CACHE_MODE:-local}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - diagramio

volumes:
  postgres_data:

networks:
  diagramio:
    driver: bridge